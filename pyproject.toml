[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risktrace"
version = "0.1.0"
description = "Reproducible feasibility and dependency-aware bank explanation audits"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==2.2.6",
  "pandas==2.2.3",
  "scipy==1.15.3",
  "scikit-learn==1.6.1",
  "PyYAML==6.0.2",
  "xgboost==2.1.4",
  "torch==2.6.0",
  "matplotlib==3.10.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
risktrace = "risktrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
